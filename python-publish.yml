# Wilson PyPI release workflow.
# Builds the wheel/sdist once, validates them, transfers the exact build artifacts
# between jobs, and publishes through PyPI Trusted Publishing (OIDC).

name: Publish Wilson Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Record distribution SHA-256 values
        run: |
          mkdir -p release-metadata
          sha256sum dist/*.whl dist/*.tar.gz | tee release-metadata/SHA256SUMS.txt

      - name: Upload release distributions
        uses: actions/upload-artifact@v7
        with:
          name: wilson-release-dists
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload release checksums
        uses: actions/upload-artifact@v7
        with:
          name: wilson-release-checksums
          path: release-metadata/SHA256SUMS.txt
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build

    permissions:
      id-token: write

    environment:
      name: pypi
      # Optional once the final PyPI project name is fixed:
      # url: https://pypi.org/p/wilson-open-middleware

    steps:
      - name: Retrieve exact release distributions
        uses: actions/download-artifact@v8
        with:
          name: wilson-release-dists
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
