# Wilson SLSA provenance workflow.
# Unlike the generic starter, this attests to the actual Wilson wheel and sdist.

name: Wilson SLSA Provenance

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build Wilson distributions
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip

      - name: Build and validate Wilson distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Generate SLSA provenance subjects
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          files=(dist/*.whl dist/*.tar.gz)
          test -e "${files[0]}"
          echo "hashes=$(sha256sum "${files[@]}" | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Upload exact attested distributions
        uses: actions/upload-artifact@v7
        with:
          name: wilson-slsa-dists
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  provenance:
    name: Generate signed SLSA provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: ${{ github.event_name == 'release' }}
      provenance-name: wilson-v0.1.intoto.jsonl

  release-assets:
    name: Attach attested distributions to GitHub Release
    if: github.event_name == 'release'
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download exact attested distributions
        uses: actions/download-artifact@v8
        with:
          name: wilson-slsa-dists
          path: dist/

      - name: Upload distributions to the published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/*.whl dist/*.tar.gz --clobber
